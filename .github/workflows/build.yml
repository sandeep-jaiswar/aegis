name: Build and Test

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }} with ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc, clang]
        build_type: [Release, Debug]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        
    - name: Set up GCC
      if: matrix.compiler == 'gcc'
      run: |
        echo "CC=gcc" >> $GITHUB_ENV
        echo "CXX=g++" >> $GITHUB_ENV
        
    - name: Set up Clang
      if: matrix.compiler == 'clang'
      run: |
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
          -DCMAKE_C_COMPILER=${{ env.CC }}
          
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --verbose
      
    - name: Verify core library was built
      run: |
        if [ -f build/core/libaegis_core.a ]; then
          echo "✓ Core library built successfully"
          ls -lh build/core/libaegis_core.a
        else
          echo "✗ Core library not found"
          exit 1
        fi
        
    - name: Check for warnings (should fail if any)
      run: |
        echo "Build completed with -Werror flag"
        echo "No warnings allowed in build"
